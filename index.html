
<!doctype html><html><head>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080a0f"><title>15M AI Scanner</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080a0f;color:#f4f6fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:620px;margin:auto;padding:16px 13px 35px}.top{display:flex;justify-content:space-between;align-items:center}
h1{font-size:23px;margin:0}.sub{font-size:11px;color:#8993a5;margin-top:3px}.status{font-size:11px;border:1px solid #294333;padding:7px 9px;border-radius:99px;color:#9ce5b6}
.toolbar{display:flex;gap:7px;overflow:auto;margin-top:14px}.toolbar button{white-space:nowrap;background:#151a24;color:#dbe2ec;border:1px solid #273044;border-radius:10px;padding:9px 13px}
.card{background:#111620;border:1px solid #222b3b;border-radius:18px;padding:15px;margin-top:11px}.row{display:flex;justify-content:space-between}.asset{font-size:18px;font-weight:800}.timer{font-size:20px;font-variant-numeric:tabular-nums}.title{font-size:11px;color:#8993a5;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.price{font-size:27px;font-weight:850;margin-top:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.metric{background:#0b0e15;border-radius:11px;padding:10px}.label{font-size:9px;color:#737e90}.val{font-size:17px;font-weight:750;margin-top:3px}.signal{text-align:center;font-weight:900;font-size:18px;padding:12px;border-radius:12px;margin-top:11px}.buy{background:#123a28;color:#9df1ba}.watch{background:#3b3219;color:#f4d47a}.pass{background:#251b21;color:#c99daa}.meta{font-size:10px;color:#778294;line-height:1.5;margin-top:9px}.note{background:#111620;border:1px solid #222b3b;border-radius:15px;padding:12px;margin-top:12px;color:#8c96a7;font-size:10px;line-height:1.5}.err{color:#ff9aa9;font-size:11px}
</style></head><body><main class="wrap">
<div class="top"><div><h1>15M AI Scanner</h1><div class="sub">LIVE MARKET DATA • PAPER MODE</div></div><div class="status" id="status">CONNECTING</div></div>
<div class="toolbar"><button onclick="filter='ALL';render()">ALL</button><button onclick="filter='STRONG';render()">STRONG</button><button onclick="filter='BTC';render()">BTC</button><button onclick="load()">REFRESH</button></div>
<div id="app"></div>
<div class="note"><b>Model warning:</b> probabilities are currently a conservative heuristic, not a proven edge. The system is collecting the inputs needed to calibrate a real model. Do not treat a green signal as a guaranteed winner.</div>
</main>
<script>
let data=[],filter="ALL";
const $=x=>document.getElementById(x);
function pct(x){return x==null?"—":(x*100).toFixed(1)+"%"}
function cents(x){return x==null?"—":(x*100).toFixed(1)+"¢"}
function money(x){return x==null?"—":"$"+Number(x).toLocaleString(undefined,{maximumFractionDigits:2})}
function timer(s){s=Math.max(0,Math.round(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function render(){
 let rows=data.filter(x=>filter==="ALL"||filter==="BTC"&&x.asset==="BTC"||filter==="STRONG"&&Math.abs(x.edge)>=.12);
 $("app").innerHTML=rows.map(x=>{
   let cls=x.action.startsWith("BUY")?"buy":x.action==="WATCH"?"watch":"pass";
   let dist=x.distance_pct==null?"—":(x.distance_pct>=0?"+":"")+x.distance_pct.toFixed(3)+"%";
   return `<section class="card"><div class="row"><div><div class="asset">${x.asset} 15 MIN</div><div class="title">${x.title||x.ticker}</div></div><div class="timer">${timer(x.seconds_left)}</div></div>
   <div class="price">${money(x.spot)}</div><div class="grid">
   <div class="metric"><div class="label">AI PROBABILITY</div><div class="val">${pct(x.model_probability)}</div></div>
   <div class="metric"><div class="label">KALSHI ASK</div><div class="val">${cents(x.yes_ask)}</div></div>
   <div class="metric"><div class="label">EST. EDGE</div><div class="val">${x.edge>=0?"+":""}${(x.edge*100).toFixed(1)}¢</div></div>
   <div class="metric"><div class="label">TIME LEFT</div><div class="val">${timer(x.seconds_left)}</div></div></div>
   <div class="signal ${cls}">${x.action} • ${x.confidence}</div>
   <div class="meta">Target: ${money(x.target)} • Distance: ${dist} • Order flow: ${(x.orderbook_imbalance*100).toFixed(1)}% • YES qty: ${x.yes_qty.toFixed(1)} • NO qty: ${x.no_qty.toFixed(1)}</div>
   </section>`
 }).join("") || `<div class="card"><div class="signal pass">NO CURRENT 15M MARKETS FOUND</div></div>`;
}
async function load(){
 const ctrl=new AbortController(); const t=setTimeout(()=>ctrl.abort(),12000);
 try{
   let r=await fetch("/api/scan?ts="+Date.now(),{signal:ctrl.signal,cache:"no-store"});
   let j=await r.json(); data=j.markets||[];
   $("status").textContent=j.live?"● LIVE":"DATA ERROR"; render();
   if(j.errors?.length){
     console.log(j.errors);
     if(!data.length) $("app").innerHTML=`<div class="card"><div class="err">${j.errors.map(x=>x.asset+": "+x.error).join("<br>")}</div></div>`;
   }
 }catch(e){
   $("status").textContent=e.name==="AbortError"?"TIMEOUT":"OFFLINE";
   $("app").innerHTML='<div class="card"><div class="err">Scanner API did not respond. Tap Refresh.</div></div>';
 }finally{clearTimeout(t)}
}
load();setInterval(load,2500);
setInterval(()=>{data.forEach(x=>x.seconds_left=Math.max(0,x.seconds_left-1));render()},1000);
</script></body></html>
